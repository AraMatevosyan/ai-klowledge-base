name: ai-knowledge-base

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg17-bookworm
    restart: unless-stopped

    ports:
      - "127.0.0.1:55432:5432"

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  migrate:
    image: ai-knowledge-base-backend

    build:
      context: ./backend
      dockerfile: Dockerfile

    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

    command:
      [
        "npm",
        "run",
        "prisma:migrate:deploy",
      ]

    depends_on:
      postgres:
        condition: service_healthy

    restart: "no"

  backend:
    image: ai-knowledge-base-backend
    restart: unless-stopped

    build:
      context: ./backend
      dockerfile: Dockerfile

    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: 3001

      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}

      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN_SECONDS: ${JWT_EXPIRES_IN_SECONDS}

      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL}

      FRONTEND_URL: ${FRONTEND_URL}
      UPLOAD_DIR: /app/storage/documents

      AUTH_COOKIE_SAME_SITE: ${AUTH_COOKIE_SAME_SITE}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS}

      DAILY_AI_BUDGET_USD: ${DAILY_AI_BUDGET_USD}

      OPENAI_CHAT_INPUT_USD_PER_MILLION_TOKENS: ${OPENAI_CHAT_INPUT_USD_PER_MILLION_TOKENS}
      OPENAI_CHAT_CACHED_INPUT_USD_PER_MILLION_TOKENS: ${OPENAI_CHAT_CACHED_INPUT_USD_PER_MILLION_TOKENS}
      OPENAI_CHAT_OUTPUT_USD_PER_MILLION_TOKENS: ${OPENAI_CHAT_OUTPUT_USD_PER_MILLION_TOKENS}
      OPENAI_EMBEDDING_USD_PER_MILLION_TOKENS: ${OPENAI_EMBEDDING_USD_PER_MILLION_TOKENS}

    ports:
      - "3001:3001"

    volumes:
      - document_storage:/app/storage

    depends_on:
      postgres:
        condition: service_healthy

      migrate:
        condition: service_completed_successfully

  frontend:
    image: ai-knowledge-base-frontend
    restart: unless-stopped

    build:
      context: ./frontend
      dockerfile: Dockerfile

      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}

    ports:
      - "3000:3000"

    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  document_storage:
